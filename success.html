<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO // Payment Complete</title><style>:root{--g:#6dff78;--g2:#32d24a;--a:#f0bd55;--m:#68a071}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#caffcf;font-family:"Courier New",monospace;background-image:linear-gradient(#10211655 1px,transparent 1px),linear-gradient(90deg,#10211655 1px,transparent 1px);background-size:20px 20px}.box{width:min(680px,calc(100% - 28px));border:3px solid #18391f;background:#030703;padding:26px;box-shadow:0 0 60px #32d04e1f}.lamp{width:20px;height:20px;background:var(--g);box-shadow:0 0 15px var(--g);margin-bottom:15px}h1{color:var(--g);margin:0 0 8px}.state{color:var(--a);margin:15px 0}.download{display:none;border:2px solid var(--g2);background:#0a180a;color:var(--g);padding:12px 16px;text-decoration:none;font-weight:bold}.download.show{display:inline-block}.muted{color:var(--m);font-size:12px;line-height:1.6}.err{color:#ff6464}</style></head><body><main class="box"><div class="lamp"></div><h1>NEO // PAYMENT RETURN</h1><div class="state" id="state">Verifying the Checkout Session...</div><p class="muted" id="detail">NEO will unlock the digital package only after the payment provider confirms it was paid.</p><a class="download" id="download">DOWNLOAD PRODUCT</a><p><a href="/store.html" style="color:#68a071">← return to store</a></p></main><script>const q=new URLSearchParams(location.search),sid=q.get('session_id'),state=document.getElementById('state'),detail=document.getElementById('detail'),dl=document.getElementById('download');async function verify(){if(!sid){state.textContent='Missing checkout session.';state.className='state err';return;}try{const r=await fetch('/api/orders/status?session_id='+encodeURIComponent(sid),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification failed');if(d.paid){state.textContent='PAYMENT CONFIRMED // PRODUCT UNLOCKED';detail.textContent=d.product_name+(d.email?' // receipt email: '+d.email:'');dl.href=d.download_url;dl.classList.add('show');}else{state.textContent='PAYMENT NOT CONFIRMED YET';setTimeout(verify,2500);}}catch(e){state.textContent='NEO VERIFICATION ERROR';state.className='state err';detail.textContent=e.message;}}verify();</script></body></html>
